<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <title>Page not found · YYC Advisory Brain</title>
  <style>
    :root { --bg: #faf7f4; --card: #ffffff; --ink: #241414; --sub: #6b5f58; --line: #e7e2dc; --brand: #9a0000; --brand-ink: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171213; --card: #211a1b; --ink: #f3ecea; --sub: #b8aaa5; --line: #3a2f30; --brand: #e0564f; --brand-ink: #1a0f0f; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; text-align: center; }
    img { width: 48px; height: 48px; object-fit: contain; }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; line-height: 1.3; }
    p { font-size: 1rem; line-height: 1.6; color: var(--sub); margin: 0 0 24px; }
    a { display: inline-block; min-height: 44px; padding: 12px 20px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); font-weight: 700; text-decoration: none; }
    a:hover { filter: brightness(1.08); }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  </style>
</head>

<body>
  <main>
    <img src="/logo.png" alt="" />
    <h1>Page not found</h1>
    <p>There is nothing at this address. The link may be old or mistyped.</p>
    <a href="/">Go to YYC Advisory Brain</a>
  </main>
</body>

</html>
