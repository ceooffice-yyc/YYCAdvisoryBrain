<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151111" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" sizes="any" href="/favicon.ico" />
  <title>Page not found · YYC Advisory Brain</title>
  <!-- Without JavaScript the browser still goes back to the first page after 3 seconds. With JavaScript, /not-found.js does it and shows the countdown. -->
  <noscript><meta http-equiv="refresh" content="3;url=/" /></noscript>
  <style>
    :root { --bg: #FAF7F2; --card: #FFFFFF; --ink: #1A1614; --title: #2A0505; --sub: #645D55; --line: #EDE7DE; --line-dark: #D8CFC2; --brand: #C00000; --brand-dark: #9A0000; --brand-ink: #FFFFFF; --gold: #B8860B; --track: #EDE7DE; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151111; --card: #1F1919; --ink: #F4EDEA; --title: #FBEDEA; --sub: #C2B5AF; --line: #322929; --line-dark: #4B3F3F; --brand: #C22F28; --brand-dark: #A3241E; --brand-ink: #FFFFFF; --gold: #C9981C; --track: #322929; }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(900px 420px at 50% -10%, rgba(192, 0, 0, 0.08), transparent 70%), var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; line-height: 1.5; }
    main { position: relative; width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 36px 28px 28px; text-align: center; box-shadow: 0 4px 12px rgba(26, 22, 20, 0.08), 0 16px 40px rgba(26, 22, 20, 0.1); overflow: hidden; }
    main::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, #C00000 0%, #7A0A0A 60%, #B8860B 100%); }
    .mark { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 10px 20px -10px rgba(154, 0, 0, 0.6); }
    .code { margin: 18px 0 0; font-size: clamp(4rem, 3rem + 8vw, 5.5rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; background: linear-gradient(135deg, var(--brand) 0%, #7A0A0A 60%, var(--gold) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: 1.5rem; margin: 10px 0 8px; line-height: 1.3; color: var(--title); }
    p { margin: 0; color: var(--sub); font-size: 1rem; line-height: 1.6; }
    .count { margin-top: 22px; font-size: 0.95rem; font-weight: 600; color: var(--ink); min-height: 1.5em; }
    .bar { margin: 10px auto 22px; width: 100%; max-width: 280px; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 100%; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, var(--brand), var(--gold)); border-radius: 999px; }
    .running .bar > span { animation: fill 3s linear forwards; }
    @keyframes fill { to { transform: scaleX(1); } }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 12px 20px; border-radius: 12px; font: inherit; font-size: 0.95rem; font-weight: 700; text-decoration: none; cursor: pointer; border: 1px solid transparent; }
    .btn-primary { background: var(--brand); color: var(--brand-ink); box-shadow: 0 1px 3px rgba(154, 0, 0, 0.3); }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-quiet { background: transparent; color: var(--ink); border-color: var(--line-dark); }
    .btn-quiet:hover { background: var(--bg); }
    .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .visually-hidden-live { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (prefers-reduced-motion: reduce) { .running .bar > span { animation: none; transform: scaleX(1); opacity: 0.4; } }
  </style>
</head>

<body>
  <main id="main" class="running">
    <img class="mark" src="/favicon.svg" alt="" width="56" height="56" />
    <div class="code" aria-hidden="true">404</div>
    <h1>Page not found</h1>
    <p>There is nothing at this address. The link may be old or mistyped.</p>
    <!-- With JavaScript this line counts down; the first announcement is read out once, the later numbers are not (aria-hidden), so screen readers are not interrupted every second. -->
    <p class="count" id="count" hidden><span id="say" class="visually-hidden-live" role="status"></span><span id="num" aria-hidden="true"></span></p>
    <div class="bar" id="bar" aria-hidden="true" hidden><span></span></div>
    <div class="actions">
      <a class="btn btn-primary" id="go" href="/">Go to YYC Advisory Brain</a>
      <button class="btn btn-quiet" id="stay" type="button" hidden>Stay on this page</button>
    </div>
    <noscript><p class="count">You will be taken back to the first page in about 3 seconds.</p></noscript>
  </main>
  <script src="/not-found.js"></script>
</body>

</html>
