# Staging tests: the server code against a REAL Supabase project made for testing (never the live one).
# Runs on demand (nightly is switched off for now, see below) (Actions tab -> "Staging tests" -> Run workflow). It is separate from ci.yml on purpose:
# it needs secrets, it talks to a real service, and a Supabase outage should not block a pull request.
#
# One-time setup (see docs/STAGING.md):
#   1. Make a separate Supabase project and run supabase/schema.sql in it.
#   2. In the repository: Settings -> Secrets and variables -> Actions -> New repository secret:
#        STAGING_SUPABASE_URL, STAGING_SUPABASE_ANON_KEY, STAGING_SUPABASE_SERVICE_ROLE_KEY
name: Staging tests

on:
  workflow_dispatch:
  # Nightly run is OFF until a separate staging Supabase project exists and the secrets are added (without them it would fail every night).
  # To turn it on, remove the "#" from the next two lines:
  # schedule:
  #   - cron: "0 20 * * *" # 20:00 UTC = 04:00 in Malaysia

permissions:
  contents: read

concurrency:
  group: staging-tests # two runs at once would share one database
  cancel-in-progress: false

jobs:
  staging:
    name: Role changes and Recently deleted, against staging Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_CONFIRM: this-is-not-production
    steps:
      - name: Stop clearly when the secrets are missing
        run: |
          if [ -z "$STAGING_SUPABASE_URL" ] || [ -z "$STAGING_SUPABASE_ANON_KEY" ] || [ -z "$STAGING_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::The staging secrets are not set. See docs/STAGING.md (one-time setup)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:staging
